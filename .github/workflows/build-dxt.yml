name: Build and Release DXT

on:
  # 手动触发（调试用）
  workflow_dispatch:

  # 打 tag 自动发布
  push:
    tags:
      - 'v*'

jobs:
  build-dxt:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ 拉代码
    - name: Checkout
      uses: actions/checkout@v4

    # 2️⃣ 安装 Node.js
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3️⃣ 安装 DXT CLI
    - name: Install DXT CLI
      run: npm install -g @anthropic-ai/dxt

    # 4️⃣ 验证 CLI 是否可用（防止 PATH 问题）
    - name: Verify DXT CLI
      run: dxt --version

    # 5️⃣ 构建 .dxt 包
    - name: Build DXT package
      run: dxt pack

    # 6️⃣ 输出目录内容（强烈建议保留）
    - name: Debug output files
      run: |
        echo "==== current dir ===="
        pwd
        echo "==== file list ===="
        ls -lh

    # 7️⃣ 确认至少生成了一个 .dxt（否则直接失败）
    - name: Ensure DXT exists
      run: |
        ls *.dxt

    # 8️⃣ 上传构建产物（artifact）
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dxt-package
        path: "*.dxt"

    # 9️⃣ 发布 GitHub Release（仅 tag 时执行）
    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: "*.dxt"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
